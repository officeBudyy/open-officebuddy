name: Deploy Website to Aliyun Server

description: |
  构建官网（Vite + TypeScript 静态站），通过 rsync 部署到阿里云服务器（Caddy 静态托管）。
  触发时机：
  1. push 到 wayne 分支（官网相关变更会重建官网）
  2. workflow_dispatch 手动触发
  3. 其他工作流显式通过 workflow_call 调用

  发布 GitHub Release 不再自动部署网站。

on:
  push:
    branches: [wayne]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the ref that triggered the caller)"
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: build & deploy → Aliyun (Caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 服务器连接信息：默认值即现有阿里云主机；如需变更优先用仓库 Secrets 覆盖。
      ALIYUN_WEBSITE_HOST: ${{ secrets.ALIYUN_WEBSITE_HOST || '47.237.68.50' }}
      ALIYUN_WEBSITE_USER: ${{ secrets.ALIYUN_WEBSITE_USER || 'root' }}
      # Caddy file_server 的 root 目录，与服务器上的 Caddyfile 保持一致
      ALIYUN_WEBSITE_TARGET_DIR: ${{ secrets.ALIYUN_WEBSITE_TARGET_DIR || '/var/www/officebuddy' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & build website
        shell: bash
        run: |
          cd website
          bun install --frozen-lockfile
          bun run build

      - name: Verify download domain resolves
        shell: bash
        run: |
          # 官网下载链接指向 dl.officebuddy.work；DNS 未解析时停止部署，保留线上旧页面，
          # 避免一次普通 main push 直接把所有下载按钮切成不可访问的地址。
          getent ahosts dl.officebuddy.work > /dev/null

      - name: Set up SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ALIYUN_WEBSITE_SSH_KEY }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "::error::Missing secret ALIYUN_WEBSITE_SSH_KEY (私钥 PEM 内容，对应服务器 ~/.ssh/authorized_keys 中的公钥)"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${ALIYUN_WEBSITE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check remote prerequisites
        shell: bash
        run: |
          # 目标机必须装有 rsync（--delete 增量同步依赖它）；缺失时给出可直接执行的安装命令。
          ssh -o StrictHostKeyChecking=accept-new \
            "${ALIYUN_WEBSITE_USER}@${ALIYUN_WEBSITE_HOST}" \
            'command -v rsync >/dev/null 2>&1 || {
              echo "服务器未安装 rsync。请登录服务器执行其一："
              echo "  yum install -y rsync    (Alibaba Cloud Linux / CentOS)"
              echo "  apt-get install -y rsync (Ubuntu / Debian)"
              exit 127;
            }'

      - name: Deploy to Aliyun server
        shell: bash
        run: |
          # --delete 保证远端与构建产物完全一致，不残留旧构建的散件；
          # 静态文件替换即时生效，无需 reload Caddy。
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            website/dist/ \
            "${ALIYUN_WEBSITE_USER}@${ALIYUN_WEBSITE_HOST}:${ALIYUN_WEBSITE_TARGET_DIR}/"
          echo "Deployed website/dist → ${ALIYUN_WEBSITE_USER}@${ALIYUN_WEBSITE_HOST}:${ALIYUN_WEBSITE_TARGET_DIR}/"

      - name: Verify website responds
        shell: bash
        run: |
          sleep 5
          for url in "http://officebuddy.work" "http://www.officebuddy.work"; do
            status=$(curl -sI -m 10 "$url" | head -1 || echo "FETCH_FAILED")
            echo "$url → $status"
          done
          # exit 0 兜底：DNS/证书传播需要时间，不阻塞 workflow
          exit 0
