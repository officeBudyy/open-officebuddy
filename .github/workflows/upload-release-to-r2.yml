name: Upload Release Assets to R2

description: |
  Copies selected GitHub Release assets to Cloudflare R2. Desktop releases use
  it for the public download mirror; mobile releases use it for IPA/APK delivery.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version to upload, for example 0.5.66."
        type: string
        required: true
      prefix:
        description: "R2 object prefix (default: app/v{version})"
        type: string
        required: false
        default: ""
      # 手机端只需要 ipa / apk：不限制的话整包桌面安装包（几百 MB）会被再传一份到
      # client-mobile/。逗号分隔，支持多个通配符。
      patterns:
        description: "Comma-separated asset globs to download (default: * = every asset)"
        type: string
        required: false
        default: ""
      upload_assets:
        description: "Download and upload release assets; set false for a prune-only call"
        type: boolean
        required: false
        default: true
      prune_previous_versions:
        description: "After a verified upload, remove sibling v<version> directories except the current one"
        type: boolean
        required: false
        default: false
      retention_group:
        description: "Stable concurrency key for uploads that prune the same version root"
        type: string
        required: false
        default: ""
      public_base_url:
        description: "Public R2 custom-domain origin used to verify every uploaded asset"
        type: string
        required: false
        default: "https://dl.officebuddy.work"
  workflow_dispatch:
    inputs:
      version:
        description: "Override tag / version (default: match the release that triggered this run)"
        type: string
        required: false
      bucket:
        description: "R2 bucket name (default: Secrets.ASTRAVIA_R2_BUCKET)"
        type: string
        required: false
        default: astravia-downloads
      prefix:
        description: "R2 object prefix (default: app/v{version}/)"
        type: string
        required: false
      patterns:
        description: "Comma-separated asset globs to download (default: * = every asset)"
        type: string
        required: false
        default: ""
      upload_assets:
        description: "Download and upload release assets; set false for a prune-only call"
        type: boolean
        required: false
        default: true
      prune_previous_versions:
        description: "After a verified upload, remove sibling v<version> directories except the current one"
        type: boolean
        required: false
        default: false
      retention_group:
        description: "Stable concurrency key for uploads that prune the same version root"
        type: string
        required: false
        default: ""
      public_base_url:
        description: "Public R2 custom-domain origin used to verify every uploaded asset"
        type: string
        required: false
        default: "https://dl.officebuddy.work"

permissions:
  contents: read

concurrency:
  # 会清历史版本的桌面上传必须跨 tag 串行，避免两个新版本同时上传后互删。手机端
  # 没传 retention_group，仍按 prefix 分组，不会与桌面目录互相阻塞。
  group: upload-r2-${{ inputs.retention_group || inputs.prefix || github.ref_name || 'all' }}
  cancel-in-progress: false

jobs:
  upload:
    name: upload ${{ github.ref_name || inputs.version }} → R2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag, version and object prefix
        id: resolve
        shell: bash
        run: |
          if [[ -n "${{ github.event.release.tag_name }}" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW="${{ inputs.version }}"
            # 输入可以是 "0.5.60" 或 "v0.5.60"
            if [[ "${RAW}" == v* ]]; then
              TAG="${RAW}"
            else
              TAG="v${RAW}"
            fi
          else
            echo "::error::No release tag or input version provided."
            exit 1
          fi
          VERSION="${TAG#v}"
          PREFIX="${{ inputs.prefix }}"
          if [[ -z "${PREFIX}" ]]; then
            PREFIX="app/v${VERSION}"
          fi
          PATTERNS="${{ inputs.patterns }}"
          if [[ -z "${PATTERNS}" ]]; then
            PATTERNS="*"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prefix=${PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "patterns=${PATTERNS}" >> "${GITHUB_OUTPUT}"
          echo "Resolved: tag=${TAG} version=${VERSION} prefix=${PREFIX} patterns=${PATTERNS}"

      - name: Install rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version

      - name: Configure R2 remote
        shell: bash
        env:
          ACCOUNT_ID: ${{ secrets.ASTRAVIA_R2_ACCOUNT_ID }}
          ACCESS_KEY_ID: ${{ secrets.ASTRAVIA_R2_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.ASTRAVIA_R2_SECRET_ACCESS_KEY }}
        run: |
          cat > "${HOME}/.config/rclone/rclone.conf" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          endpoint = https://${ACCOUNT_ID}.r2.cloudflarestorage.com
          env_auth = false
          access_key_id = ${ACCESS_KEY_ID}
          secret_access_key = ${SECRET_ACCESS_KEY}
          no_check_bucket = true
          chunk_size = 32M
          EOF
          rclone version
          echo "rclone config written to ${HOME}/.config/rclone/rclone.conf"

      - name: Verify R2 bucket is reachable
        shell: bash
        env:
          BUCKET: ${{ secrets.ASTRAVIA_R2_BUCKET }}
        run: |
          rclone lsd "r2:${BUCKET}" --max-depth 0
          echo "Bucket ${BUCKET} reachable."

      - name: Download release assets from GitHub
        if: inputs.upload_assets != false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PATTERNS: ${{ steps.resolve.outputs.patterns }}
        run: |
          rm -rf /tmp/astravia-release && mkdir -p /tmp/astravia-release
          cd /tmp/astravia-release
          IFS=',' read -ra GLOBS <<< "${PATTERNS}"
          for pattern in "${GLOBS[@]}"; do
            glob="$(echo "${pattern}" | xargs)"
            [[ -z "${glob}" ]] && continue
            # 手机端只要 ipa/apk，但缺签名凭据时 APK 本来就不会存在：单个 pattern
            # 没匹配到不应该把整条上传带成失败。
            gh release download "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${glob}" \
              --clobber \
              || echo "::warning::No asset matched ${glob}"
          done
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::No release asset matched ${PATTERNS} on ${TAG}"
            exit 1
          fi
          echo "Downloaded ${count} assets:"
          ls -1

      - name: Upload assets to R2
        if: inputs.upload_assets != false
        shell: bash
        env:
          BUCKET: ${{ secrets.ASTRAVIA_R2_BUCKET }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
        run: |
          echo "Uploading to r2:${BUCKET}/${PREFIX}/"
          rclone copy \
            /tmp/astravia-release \
            "r2:${BUCKET}/${PREFIX}" \
            --verbose \
            --transfers 4 \
            --checkers 4
          echo "---"
          echo "Uploaded objects:"
          rclone ls "r2:${BUCKET}/${PREFIX}" | tail -30

      - name: Verify uploaded assets
        if: inputs.upload_assets != false
        shell: bash
        env:
          BUCKET: ${{ secrets.ASTRAVIA_R2_BUCKET }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
        run: |
          # 清理旧版本之前先逐文件核对当前版本；上传不完整时必须保留旧包兜底。
          rclone check \
            /tmp/astravia-release \
            "r2:${BUCKET}/${PREFIX}" \
            --one-way

      - name: Verify public download URLs
        if: inputs.upload_assets != false
        shell: bash
        env:
          PREFIX: ${{ steps.resolve.outputs.prefix }}
          PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
        run: |
          set -euo pipefail
          BASE="${PUBLIC_BASE_URL%/}/${PREFIX}"
          while IFS= read -r asset; do
            [[ -z "${asset}" ]] && continue
            url="${BASE}/${asset}"
            echo "Verifying ${url}"
            curl --fail --silent --show-error --head \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 5 \
              "${url}" > /dev/null
          done < <(find /tmp/astravia-release -maxdepth 1 -type f -exec basename {} \; | sort)

      - name: Prune previous version directories
        if: inputs.prune_previous_versions == true
        shell: bash
        env:
          BUCKET: ${{ secrets.ASTRAVIA_R2_BUCKET }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="${PREFIX%/*}"
          if [[ -z "${ROOT}" || "${ROOT}" == "${PREFIX}" ]]; then
            echo "::error::Refusing to prune an unscoped R2 prefix: ${PREFIX}"
            exit 1
          fi

          # 规划脚本只接受当前目录名恰好为 v${VERSION} 的前缀，并且只输出同级的
          # v<语义版本> 目录；普通目录、手机包目录和当前版本不会进入删除列表。
          rclone lsf "r2:${BUCKET}/${ROOT}" --dirs-only \
            | node scripts/release/r2-version-retention.mjs \
                --prefix "${PREFIX}" \
                --version "${VERSION}" \
            > /tmp/r2-prune-prefixes.txt

          if [[ ! -s /tmp/r2-prune-prefixes.txt ]]; then
            echo "No previous version directories to prune under ${ROOT}/."
            exit 0
          fi

          while IFS= read -r old_prefix; do
            [[ -z "${old_prefix}" ]] && continue
            echo "Pruning r2:${BUCKET}/${old_prefix}/"
            rclone purge "r2:${BUCKET}/${old_prefix}"
          done < /tmp/r2-prune-prefixes.txt

      - name: Summarise release destination
        if: inputs.upload_assets != false
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
          BUCKET: ${{ secrets.ASTRAVIA_R2_BUCKET }}
        run: |
          # Cloudflare R2 public URL (if bucket has public access enabled)
          echo "## Release → R2 Upload Summary" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Release tag: \`${TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Release version: \`${VERSION}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- R2 bucket: \`${BUCKET}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- R2 object prefix: \`${PREFIX}/\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Total objects uploaded:" >> "${GITHUB_STEP_SUMMARY}"
          rclone lsd "r2:${BUCKET}/${PREFIX}" 2>/dev/null >> "${GITHUB_STEP_SUMMARY}" \
            || rclone ls "r2:${BUCKET}/${PREFIX}" | wc -l >> "${GITHUB_STEP_SUMMARY}"
